name: Continuous integration

# trigger khi commit mới được push vào master
on: push

jobs:
  fe-ci:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup NodeJS (do runner không có sẵn node)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Cache npm (tăng tốc CI)
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-

      # 4. Install dependencies
      # Ưu tiên npm ci, fallback sang npm install nếu lỗi
      - name: Install dependencies
        run: |
          npm ci || npm install

      # 5. Build frontend
      - name: Build frontend
        run: npm run build

      # 6. Log folder build
      - name: LS build
        run: ls -la build

      # 7. Upload artifact (upload kết quả build)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fe-dist
          path: build #path folder sinh ra sau khi build xong
